<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <title>Trombone Practice Timer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="app-icon">
                <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                    <rect width="60" height="60" rx="13" fill="url(#iconGradient)"/>
                    <path d="M15 25 L20 25 L35 15 L45 15 L45 45 L35 45 L20 35 L15 35 Z" fill="white" opacity="0.95"/>
                    <circle cx="42" cy="30" r="3" fill="white" opacity="0.9"/>
                    <defs>
                        <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#007aff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#0051d5;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1>Trombone Practice Timer</h1>
            <p class="app-subtitle">Professional Practice Companion</p>
        </header>

        <main>
            <!-- Practice Stopwatch Section -->
            <section class="card stopwatch-section">
                <h2>Practice Timer</h2>
                <div class="card-body">
                    <div class="timer-container">
                        <svg class="timer-ring" viewBox="0 0 200 200">
                            <circle class="timer-ring-bg" cx="100" cy="100" r="85" />
                            <circle class="timer-ring-progress" cx="100" cy="100" r="85" id="timerRing" />
                        </svg>
                        <div class="stopwatch-display" id="stopwatchDisplay">00:00:00</div>
                    </div>
                    <p class="timer-hint">Click "Done" to save your session</p>
                </div>
                <div class="card-footer">
                    <div class="controls">
                        <button id="startBtn" class="btn btn-primary">Start</button>
                        <button id="pauseBtn" class="btn btn-secondary" disabled>Pause</button>
                        <button id="doneBtn" class="btn btn-success" disabled>Done</button>
                    </div>
                </div>
            </section>

            <!-- Practice History Section -->
            <section class="card history-section">
                <h2>Practice History</h2>
                <div class="card-body">
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-label">Today</div>
                            <div class="stat-value" id="todayTotal">0h 0m</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">7-Day Total</div>
                            <div class="stat-value" id="weekTotal">0h 0m</div>
                        </div>
                    </div>
                    <div class="daily-breakdown">
                        <h3>Last 7 Days</h3>
                        <div id="dailyList" class="daily-list"></div>
                    </div>
                </div>
            </section>

            <!-- Metronome Section -->
            <section class="card metronome-section">
                <h2>Metronome</h2>
                <div class="card-body">
                    <div class="bpm-container">
                        <div class="bpm-display" id="bpmDisplay">120</div>
                        <div class="bpm-label">BPM</div>
                    </div>
                    <div class="control-group">
                        <div class="input-group">
                            <label for="bpmSlider">Tempo:</label>
                            <input type="range" id="bpmSlider" min="40" max="240" value="120" step="1">
                            <input type="number" id="bpmInput" min="40" max="240" value="120">
                        </div>
                        <div class="input-group">
                            <label for="beatsPerMeasure">Beats per measure:</label>
                            <input type="number" id="beatsPerMeasure" min="1" max="16" value="4">
                        </div>
                        <div class="input-group">
                            <label for="metronomeVolume">Volume:</label>
                            <input type="range" id="metronomeVolume" min="0" max="100" value="70" step="1">
                            <span id="metronomeVolumeDisplay">70%</span>
                        </div>
                    </div>
                    <div class="beat-indicator" id="beatIndicator"></div>
                </div>
                <div class="card-footer">
                    <div class="controls">
                        <button id="metronomeBtn" class="btn btn-primary">Start Metronome</button>
                    </div>
                </div>
            </section>

            <!-- Tuning Tone Generator Section -->
            <section class="card tuner-section">
                <h2>Tuning Tone</h2>
                <div class="card-body">
                    <div class="tone-display">
                        <div class="note-display" id="noteDisplay">F3</div>
                        <div class="freq-display" id="freqDisplay">174.61 Hz</div>
                    </div>
                    <div class="control-group">
                        <div class="input-group">
                            <label for="noteSelect">Note:</label>
                            <select id="noteSelect">
                                <option value="C">C</option>
                                <option value="C#">C#/Db</option>
                                <option value="D">D</option>
                                <option value="D#">D#/Eb</option>
                                <option value="E">E</option>
                                <option value="F" selected>F</option>
                                <option value="F#">F#/Gb</option>
                                <option value="G">G</option>
                                <option value="G#">G#/Ab</option>
                                <option value="A">A</option>
                                <option value="A#">A#/Bb</option>
                                <option value="B">B</option>
                            </select>
                            <label for="octaveSelect">Octave:</label>
                            <select id="octaveSelect">
                                <option value="2">2</option>
                                <option value="3" selected>3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="volumeSlider">Volume:</label>
                            <input type="range" id="volumeSlider" min="0" max="100" value="50" step="1">
                            <span id="volumeDisplay">50%</span>
                        </div>
                    </div>
                </div>
                <div class="card-footer">
                    <div class="controls">
                        <button id="toneBtn" class="btn btn-primary">Start Tone</button>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>Practice makes progress! 🎵</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
